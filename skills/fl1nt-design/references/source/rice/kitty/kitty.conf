# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# fl1nt.dev brand terminal - CRT aesthetic to match the site
#   font:    Terminus (TTF) - the site's --font-mono, installed in ~/.local/share/fonts/fl1nt-brand
#   colors:  fl1nt palette (kitty-themes/fl1nt.conf) - same tokens as fl1nt.dev :root
#   cursor:  blinking primary block, like the site's typing caret
#   bg:      subtle CRT scanlines (fl1nt-scanlines.png) - comment out background_image to disable

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/fl1nt.conf

# Brand mono font. Terminus is bitmap-crisp; 15pt == its native 20px size.
font_family      family="Terminus (TTF)" style=Medium
bold_font        family="Terminus (TTF)" style=Bold
italic_font      family="Terminus (TTF)" style=Italic
bold_italic_font family="Terminus (TTF)" style="Bold-Italic"
font_size 15.0

# Nerd Font symbols (icons in prompts/CLIs) via the installed symbols-only font,
# so Terminus stays pure for text but icons still render.
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font

# CRT scanlines - 1x2px tile, barely-lifted purple-black rows
background_image ~/.config/kitty/fl1nt-scanlines.png
background_image_layout tiled
background_tint 0.55

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor - blinking primary block, same cadence as fl1nt.dev's caret (0.75s)
cursor_trail 1
cursor_shape block
cursor_blink_interval 0.75
cursor_stop_blinking_after 0
shell_integration no-cursor

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 6

# Tab bar - purple-on-black status readout, like the site header
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index} {title} "
