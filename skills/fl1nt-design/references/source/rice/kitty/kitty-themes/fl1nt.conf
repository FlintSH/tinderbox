# fl1nt - kitty theme
# Matches the fl1nt Hyprland palette (~/.config/hypr/fl1nt-colors.conf)
# primary #867cff | secondary #ff69b4 | accent #00ffff | bg #000000

# Base
foreground              #ffffff
background              #000000
selection_foreground    #ffffff
selection_background    #6b63cc

# Cursor - primary purple block, like the fl1nt.dev typing caret
cursor                  #867cff
cursor_text_color       #000000

# URLs underline in bright primary
url_color               #a499ff

# Window borders (kitty-internal splits)
active_border_color     #867cff
inactive_border_color   #6b63cc
bell_border_color       #ffaa00

# Tab bar
active_tab_foreground   #000000
active_tab_background   #867cff
inactive_tab_foreground #999999
inactive_tab_background #0a0a0a
tab_bar_background      #000000

# Marks
mark1_foreground #000000
mark1_background #00ffff
mark2_foreground #000000
mark2_background #ff69b4

# ANSI colors
# black
color0  #0a0a0a
color8  #4d4d4d
# red -> fl1nt error
color1  #ff4444
color9  #ff7070
# green -> fl1nt success
color2  #00ff41
color10 #66ff8c
# yellow -> fl1nt warning
color3  #ffaa00
color11 #ffc44d
# blue -> fl1nt primary
color4  #867cff
color12 #a499ff
# magenta -> fl1nt secondary (pink)
color5  #ff69b4
color13 #ff8cc6
# cyan -> fl1nt accent
color6  #00e5e5
color14 #00ffff
# white
color7  #cfcfcf
color15 #ffffff
