# Hyprlock config styled to match waybar fl1nt.dev theme

# fl1nt.dev authentic colors matching waybar
$fl1nt-primary = rgb(867cff)
$fl1nt-primary-dim = rgb(6b63cc)
$fl1nt-primary-bright = rgb(a499ff)
$fl1nt-secondary = rgb(ff69b4)
$fl1nt-accent = rgb(00ffff)
$fl1nt-success = rgb(00ff41)
$fl1nt-warning = rgb(ffaa00)
$fl1nt-error = rgb(ff4444)
$fl1nt-bg-primary = rgb(000000)
$fl1nt-bg-secondary = rgba(0, 0, 0, 0.85)
$fl1nt-bg-tertiary = rgba(0, 0, 0, 0.95)
$fl1nt-bg-overlay = rgba(134, 124, 255, 0.1)
$fl1nt-text-primary = rgb(ffffff)
$fl1nt-text-secondary = rgb(cfcfcf)
$fl1nt-text-dim = rgb(999999)

general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    path = ~/Pictures/wallpapers/blue-bg.png
    color = $fl1nt-bg-primary
    blur_size = 2
    blur_passes = 2
    noise = 0.01
    contrast = 1.1
    brightness = 0.8
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Date at top
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %-d %B')"
    color = $fl1nt-text-secondary
    font_size = 20
    font_family = Terminus (TTF), Space Mono, JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# Main time display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fl1nt-text-primary
    font_size = 96
    font_family = Terminus (TTF), Space Mono, JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Seconds
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%S')"
    color = $fl1nt-primary
    font_size = 32
    font_family = Terminus (TTF), Space Mono, JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $fl1nt-text-primary
    font_size = 24
    font_family = Terminus (TTF), Space Mono, JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 400, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $fl1nt-primary
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = $fl1nt-text-primary
    capslock_color = $fl1nt-warning
    fade_on_empty = true
    fade_timeout = 3000
    font_family = Terminus (TTF), Space Mono, JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##999999">password</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    rounding = 8
}

# Fingerprint hint
label {
    monitor =
    text = enter + fingerprint
    color = $fl1nt-primary
    font_size = 14
    font_family = Terminus (TTF), Space Mono, JetBrainsMono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}

# Battery - bottom center
label {
    monitor =
    text = cmd[update:10000] echo "bat $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'ac')%"
    color = $fl1nt-text-dim
    font_size = 14
    font_family = Terminus (TTF), Space Mono, JetBrainsMono Nerd Font
    position = 0, -350
    halign = center
    valign = center
}
